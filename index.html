<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أنس جيمنج - النظام الاحترافي المتقدم</title>
<!-- استدعاء مكتبة تلوين الأكواد Prism.js -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-okaidia.min.css" rel="stylesheet" />
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
body { background-color: #05070b; color: #e6edf3; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; overflow-x: hidden; }

/* تأثير الانتقال بموج الموج الخفيف */
.card { background: #0d1117; border: 1px solid #30363d; padding: 30px; border-radius: 20px; box-shadow: 0 12px 35px rgba(0,0,0,0.8); width: 100%; max-width: 800px; position: relative; display: none; animation: waveTransition 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
.card.active { display: block; }

@keyframes waveTransition {
  0% { opacity: 0; transform: translateY(25px) scale(0.97); }
  60% { opacity: 0.8; transform: translateY(-5px) scale(1.01); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #30363d; padding-bottom: 15px; }
.header-title-group { display: flex; align-items: center; gap: 12px; }
.logo-img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid #58a6ff; box-shadow: 0 0 10px rgba(88,166,255,0.4); }
.header h1 { color: #58a6ff; font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
.top-btn { background: #1f6feb; color: white; border: none; padding: 9px 18px; border-radius: 10px; cursor: pointer; font-size: 13px; text-decoration: none; font-weight: 600; transition: all 0.2s; box-shadow: 0 4px 12px rgba(31,111,235,0.3); display: inline-flex; align-items: center; gap: 6px; }
.top-btn:hover { background: #388bfd; transform: translateY(-1px); }

.textarea-wrapper { position: relative; }
textarea { width: 100%; height: 260px; background: #161b22; color: #f0f6fc; border: 1px solid #30363d; border-radius: 12px; padding: 16px; font-size: 15px; resize: vertical; outline: none; transition: all 0.3s; line-height: 1.6; font-family: 'Consolas', monospace; }
textarea:focus { border-color: #58a6ff; box-shadow: 0 0 0 4px rgba(88, 166, 255, 0.15); }
.stats-bar { display: flex; justify-content: space-between; font-size: 12px; color: #8b949e; margin-top: 8px; padding: 0 4px; }

.advanced-settings { background: #161b22; border: 1px solid #30363d; padding: 15px 20px; border-radius: 12px; margin-top: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; align-items: center; }
.setting-item { display: flex; flex-direction: column; gap: 5px; }
.setting-item label { font-size: 13px; color: #8b949e; font-weight: 600; }
.setting-item input[type="password"] { background: #0d1117; border: 1px solid #30363d; color: #fff; padding: 8px 12px; border-radius: 8px; outline: none; font-size: 14px; letter-spacing: 2px; }
.setting-item input[type="password"]:focus { border-color: #58a6ff; }
.checkbox-group { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; color: #c9d1d9; }
.checkbox-group input { width: 16px; height: 16px; accent-color: #da3633; cursor: pointer; }

.btn-group { display: flex; gap: 12px; margin-top: 20px; }
.btn { background: #238636; color: white; border: none; padding: 14px; font-size: 16px; border-radius: 12px; cursor: pointer; width: 100%; transition: all 0.2s; font-weight: bold; box-shadow: 0 4px 14px rgba(35,134,54,0.3); }
.btn:hover { background: #2ea043; transform: translateY(-1px); }
.btn.clear-btn { background: #da3633; box-shadow: 0 4px 14px rgba(218,54,51,0.3); max-width: 140px; }
.btn.clear-btn:hover { background: #f85149; }

/* واجهة كلمة المرور وحرق الصفحة */
.password-wall { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; text-align: center; gap: 20px; }
.password-wall h2 { color: #f85149; font-size: 22px; }
.password-wall p { color: #8b949e; font-size: 14px; }
.password-wall input { background: #161b22; border: 1px solid #30363d; color: #fff; padding: 12px 20px; border-radius: 10px; font-size: 18px; text-align: center; letter-spacing: 5px; outline: none; width: 220px; }
.password-wall input:focus { border-color: #58a6ff; }

/* منطقة عرض الأكواد الملونة */
.code-view-container { background: #161b22; border-radius: 12px; border: 1px solid #30363d; max-height: 480px; overflow-y: auto; margin-bottom: 80px; text-align: left; direction: ltr; }
pre[class*="language-"] { margin: 0 !important; background: #161b22 !important; padding: 20px !important; font-size: 14px !important; }

/* زر النسخ الثابت بالأسفل */
.fixed-copy-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(13, 17, 23, 0.95); backdrop-filter: blur(12px); border-top: 1px solid #30363d; padding: 16px; display: flex; justify-content: center; box-shadow: 0 -6px 25px rgba(0,0,0,0.6); z-index: 1000; }
.fixed-copy-btn { background: #1f6feb; color: white; border: none; padding: 14px 40px; font-size: 16px; border-radius: 12px; cursor: pointer; font-weight: bold; width: 100%; max-width: 450px; transition: all 0.2s; box-shadow: 0 4px 15px rgba(31,111,235,0.4); display: flex; align-items: center; justify-content: center; gap: 8px; }
.fixed-copy-btn:hover { background: #388bfd; transform: translateY(-2px); }

/* التنبيهات */
.toast { position: fixed; top: 25px; left: 50%; transform: translateX(-50%) translateY(-20px); background: #238636; color: white; padding: 12px 25px; border-radius: 10px; font-weight: bold; opacity: 0; transition: all 0.3s ease; z-index: 1100; box-shadow: 0 6px 20px rgba(0,0,0,0.5); pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="toast" id="toastMsg">تم بنجاح!</div>

</div>
</div>
<div class="textarea-wrapper">
<textarea id="userInput" placeholder="اكتب نصك، كود البرمجة، أو السكربت هنا..." oninput="updateStats()"></textarea>
</div>
<div class="stats-bar">
<span id="charCount">عدد الحروف: 0</span>
<span id="lineCount">عدد الأسطر: 0</span>
</div>
<div class="advanced-settings">
<div class="setting-item">
<label for="passInput">حماية بكلمة مرور (اختياري):</label>
<input type="password" id="passInput" maxlength="6" placeholder="مثال: 1234">
</div>
<div style="display: flex; flex-direction: column; justify-content: center; gap: 10px;">
<label class="checkbox-group">
<input type="checkbox" id="burnCheck"> تفعيل خيار حرق الصفحة (تدمير ذاتي بعد أول قراءة)
</label>
</div>
</div>
<div class="btn-group">
<button class="btn clear-btn" onclick="clearText()">مسح الكل</button>
<button class="btn" onclick="generateLink()">إنشاء الرابط</button>
</div>
</div>

<!-- 2. واجهة طلب كلمة المرور للمشاهد -->
<div class="card" id="passwordBox">
<div class="header">
<div class="header-title-group">
<img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAIAAAAlC+aJAAAACXBIWXMAAA7DAAAOwwHHb6hkAAAGBElEQVR4nO2abWwUVRjHfzO33d3u20XawgttK4K1FBRg2sJSWqogISbEGxJ8ICFgo6gJCYImhCgI0ZgQGqNNEzUmjR+g0UaDMa2BoiK2gqK0lO22051l57a72zM9zPnnzs6utrTdtnc3Odl8yWSfmdmffP+X53nPOfecc3NCP2O8A3yG3e83nAHj2gDAm0wVAKdF3o04BcaFAHYE2Pz+5g8fA9WAFK8Hw6AA7AE9w8EALAE9x3sO/wB2bAH48zZ9YF/L/gCgG/YkQzAAfI+3T5f4w4YF7y3gH15uALk6DAqAPJzLAn6LAvw7E2LAvs7fR87D/GSAOAE0DqB9gE0B5BcAaQ40G4APoU0B2xAAW0Y5BwAwC4AlM9DkAOIAAHAAHwDAEADgAQA4AIAnAHAASAAAkAEJ6A0AgAEBIIwBAHhB638A0A0AIA0A0H2A90eA2wLAAQByAcAeA+AAABQAAHAAgAAAwAkAQAcAIAEAABoA2A38YQDAHwDAAQA4AIACAPgOAEAOAEADAAAE4I8BIAAAwAFcIAYAIOAHAIADoAAAzwAcIAYAABz+AAcAwAEAADvAAQCABwCAGwAATAAAcAAAywAcIAAAsACAAAEA3AAAwAIAAAAwAAAUABAAAACAAQAAADAAABQAEAAAANsFAACAAQAAANsFAACAAQAAAP8DAAQAAC8AAMAXAACYAADAAQAAGAAAwBsAALgBAAAnAAAgAAAwAAAUAABgAQAACAAAwAEAUNsFAACAAQAAANAHAACAAQAAAH4DAACA/wMAAPADAABbAADA/wMAAAsAABgAALADAAAIAABcAAAgAAAwAAAUAABwAQAAAHAAAAAAwAEAAAcAAEAHAAC8AABAAP//287/m/r4P8+38v4AAAAASUVORK5CYII=" class="logo-img" alt="Anas Gaming">
<h1>حماية المحتوى</h1>
</div>
</div>
<div class="password-wall">
<h2>🔒 هذا النص محمي برمز سري</h2>
<p>الرجاء إدخال الرمز السري لعرض المحتوى:</p>
<input type="password" id="unlockInput" maxlength="6" placeholder="••••••">
<button class="top-btn" onclick="verifyPassword()" style="padding: 12px 30px; font-size: 16px;">فتح المحتوى</button>
</div>

<!-- 3. واجهة عرض النص للمشاهد (مع زر الإنشاء العلوي) -->
<div class="card" id="viewBox">
<div class="header">
<div class="header-title-group">
<img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAIAAAAlC+aJAAAACXBIWXMAAA7DAAAOwwHHb6hkAAAGBElEQVR4nO2abWwUVRjHfzO33d3u20XawgttK4K1FBRg2sJSWqogISbEGxJ8ICFgo6gJCYImhCgI0ZgQGqNNEzUmjR+g0UaDMa2BoiK2gqK0lO22051l57a72zM9zPnnzs6utrTdtnc3Odl8yWSfmdmffP+X53nPOfecc3NCP2O8A3yG3e83nAHj2gDAm0wVAKdF3o04BcaFAHYE2Pz+5g8fA9WAFK8Hw6AA7AE9w8EALAE9x3sO/wB2bAH48zZ9YF/L/gCgG/YkQzAAfI+3T5f4w4YF7y3gH15uALk6DAqAPJzLAn6LAvw7E2LAvs7fR87D/GSAOAE0DqB9gE0B5BcAaQ40G4APoU0B2xAAW0Y5BwAwC4AlM9DkAOIAAHAAHwDAEADgAQA4AIAnAHAASAAAkAEJ6A0AgAEBIIwBAHhB638A0A0AIA0A0H2A90eA2wLAAQByAcAeA+AAABQAAHAAgAAAwAkAQAcAIAEAABoA2A38YQDAHwDAAQA4AIACAPgOAEAOAEADAAAE4I8BIAAAwAFcIAYAIOAHAIADoAAAzwAcIAYAABz+AAcAwAEAADvAAQCABwCAGwAATAAAcAAAywAcIAAAsACAAAEA3AAAwAIAAAAwAAAUABAAAACAAQAAADAAABQAEAAAANsFAACAAQAAANsFAACAAQAAAP8DAAQAAC8AAMAXAACYAADAAQAAGAAAwBsAALgBAAAnAAAgAAAwAAAUAABgAQAACAAAwAEAUNsFAACAAQAAANAHAACAAQAAAH4DAACA/wMAAPADAABbAADA/wMAAAsAABgAALADAAAIAABcAAAgAAAwAAAUAABwAQAAAHAAAAAAwAEAAAcAAEAHAAC8AABAAP//287/m/r4P8+38v4AAAAASUVORK5CYII=" class="logo-img" alt="Anas Gaming">
<h1>عرض النص البرمجي</h1>
</div>
<a href="?" class="top-btn">إنشاء نص جديد +</a>
</div>
<div class="code-view-container">
<pre><code id="codeDisplay" class="language-none">جارٍ تحميل المحتوى...</code></pre>
</div>
<div class="fixed-copy-bar">
<button class="fixed-copy-btn" onclick="copyMainText()">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
  نسخ النص كامل تلقائياً
</button>
</div>
</div>

<!-- تحميل حزم اللغات لـ Prism.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-lua.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
<script>
function updateStats() {
const text = document.getElementById('userInput').value;
document.getElementById('charCount').textContent = 'عدد الحروف: ' + text.length;
const lines = text ? text.split('\n').length : 0;
document.getElementById('lineCount').textContent = 'عدد الأسطر: ' + lines;
}

function clearText() {
document.getElementById('userInput').value = '';
document.getElementById('passInput').value = '';
document.getElementById('burnCheck').checked = false;
updateStats();
showToast("تم مسح النموذج بنجاح!");
}

function switchView(viewId) {
document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
document.getElementById(viewId).classList.add('active');
}

// دالة تشفير آمنة تمنع تلف الروابط نهائياً
function safeEncode(str) {
return encodeURIComponent(btoa(unescape(encodeURIComponent(str))));
}

// دالة فك التشفير الآمنة
function safeDecode(encodedStr) {
return decodeURIComponent(escape(atob(decodeURIComponent(encodedStr))));
}

// فحص الرابط عند الفتح بشكل دقيق وآمن
const urlParams = new URLSearchParams(window.location.search);
const encodedData = urlParams.get('data');
const securePass = urlParams.get('p');
let globalDecodedText = "";

if (encodedData) {
try {
const jsonString = safeDecode(encodedData);
const payload = JSON.parse(jsonString);

// فحص التدمير الذاتي (حرق الصفحة)
if (payload.b) {
const burnKey = 'burned_' + encodedData.substring(0, 15);
if (localStorage.getItem(burnKey)) {
switchView('viewBox');
document.getElementById('codeDisplay').textContent = "⚠️ عذراً، تم حرق هذا الرابط وتدميره ذاتياً بعد أول قراءة ولن يعمل مرة أخرى!";
throw new Error("Burned");
}
localStorage.setItem(burnKey, 'true');
}

globalDecodedText = payload.t;

if (securePass) {
switchView('passwordBox');
} else {
showContent(globalDecodedText);
}
} catch (e) {
if(e.message !== "Burned") {
switchView('mainBox');
showToast("عذراً، الرابط تالف أو غير صالح.");
}
}
} else {
switchView('mainBox');
}

function verifyPassword() {
const enteredPass = document.getElementById('unlockInput').value;
if (enteredPass === securePass) {
showContent(globalDecodedText);
} else {
showToast("كلمة المرور غير صحيحة!");
}
}

function showContent(text) {
switchView('viewBox');
const codeElement = document.getElementById('codeDisplay');
codeElement.textContent = text;
detectAndHighlight(text, codeElement);
}

function detectAndHighlight(text, element) {
let detectedLang = 'none';
const lower = text.toLowerCase();
if (lower.includes('def ') || lower.includes('import ') || lower.includes('print(')) detectedLang = 'python';
else if (lower.includes('function') || lower.includes('const ') || lower.includes('console.log')) detectedLang = 'javascript';
else if (lower.includes('local ') || lower.includes('end') || lower.includes('game.players')) detectedLang = 'lua';
else if (text.trim().startsWith('<') && text.trim().endsWith('>')) detectedLang = 'markup';
else if (text.trim().startsWith('{') || text.trim().startsWith('[')) detectedLang = 'json';
element.className = 'language-' + detectedLang;
Prism.highlightElement(element);
}

function generateLink() {
const text = document.getElementById('userInput').value;
const pass = document.getElementById('passInput').value.trim();
const burn = document.getElementById('burnCheck').checked;

if (!text.trim()) {
showToast("الرجاء كتابة أو لصق نص أولاً!");
return;
}

const payload = { t: text, b: burn };
const encoded = safeEncode(JSON.stringify(payload));
let fullLink = window.location.origin + window.location.pathname + '?data=' + encoded;
if (pass) {
fullLink += '&p=' + pass;
}

// الانتقال التلقائي الفوري لصفحة المشاهدين بالرابط الجديد السليم
window.location.href = fullLink;
}

function copyMainText() {
navigator.clipboard.writeText(globalDecodedText);
showToast("تم نسخ النص بالكامل تلقائياً!");
}

function showToast(msg) {
const t = document.getElementById('toastMsg');
t.textContent = msg;
t.classList.add('show');
setTimeout(() => { t.classList.remove('show'); }, 2500);
}
</script>
</body>
</html>
