<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أنس جيمينج - النظام الاحترافي المتقدم</title>
    <!-- استدعاء مكتبة تلوين الأكواد Prism.js -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-okaidia.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #0e070b; color: #dedef1; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; overflow-x: hidden; }
        
        /* تأثير الانتقال بسوج الموج الخفيف */
        .card { background: #1d1117; border: 1px solid #30363d; padding: 30px; border-radius: 28px; box-shadow: 0 12px 35px rgba(0,0,0,0.8); width: 100%; max-width: 880px; position: relative; display: none; animation: waveTransition 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .card.active { display: block; }
        @keyframes waveTransition {
            0% { opacity: 0; transform: translateY(25px) scale(0.97); }
            80% { opacity: 0.8; transform: translateY(-5px) scale(1.01); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #30363d; padding-bottom: 15px; }
        .logo-img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid #58a6ff; box-shadow: 0 0 10px rgba(88,166,255,0.4); }
        .header-title-group { display: flex; align-items: center; gap: 12px; }
        header h1 { color: #58a6ff; font-size: 22px; font-weight: 700; }
        
        .top-btn { background: #1f6feb; color: white; border: none; padding: 9px 18px; border-radius: 10px; cursor: pointer; font-size: 13px; text-decoration: none; font-weight: 600; transition: background 0.2s; box-shadow: 0 4px 12px rgba(31,111,235,0.3); display: inline-flex; align-items: center; gap: 6px; }
        .top-btn:hover { background: #1f6feb; }

        .textarea-wrapper { position: relative; }
        textarea { width: 100%; height: 260px; background: #161b22; color: #f0f6fc; border: 1px solid #30363d; border-radius: 12px; padding: 12px; font-size: 15px; resize: vertical; outline: none; transition: all 0.3s; line-height: 1.6; font-family: 'Consolas', monospace; }
        textarea:focus { border-color: #58a6ff; box-shadow: 0 0 4px rgba(88, 166, 255, 0.15); }
        .stats-bar { display: flex; justify-content: space-between; font-size: 12px; color: #8b949e; margin-top: 8px; padding: 0 4px; }

        .advanced-settings { background: #161b22; border: 1px solid #30363d; padding: 15px 20px; border-radius: 12px; margin-top: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; align-items: center; }
        .setting-item { display: flex; flex-direction: column; gap: 5px; position: relative; }
        .setting-item label { font-size: 11px; color: #8b949e; font-weight: 600; }
        
        .setting-item input[type="password"] { background: #1d1117; border: 1px solid #30363d; color: #fff; padding: 8px 12px; border-radius: 8px; outline: none; font-size: 14px; letter-spacing: 2px; transition: border-color 0.3s; }
        .setting-item input[type="password"].error-border { border-color: #da3633 !important; box-shadow: 0 0 5px rgba(218,54,53,0.3); }
        .password-error-msg { font-size: 11px; color: #da3633; display: none; margin-top: 2px; }

        .checkbox-group { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; color: #c9d1d9; }
        .checkbox-group input { width: 16px; height: 16px; accent-color: #da3633; cursor: pointer; }

        .btn-group { display: flex; gap: 12px; margin-top: 20px; }
        .btn { background: #238636; color: white; border: none; padding: 14px 20px; font-size: 16px; border-radius: 12px; cursor: pointer; width: 100%; transition: background 0.26s; font-weight: bold; box-shadow: 0 4px 14px rgba(35,134,54,0.3); display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn:hover { background: #238636; }
        
        .btn:disabled, .btn.disabled { background: #30363d !important; color: #8b949e !important; cursor: not-allowed !important; transform: none !important; box-shadow: none !important; opacity: 0.5; pointer-events: none; }

        .btn.clear-btn { background: #da3633; box-shadow: 0 4px 14px rgba(218,54,53,0.3); max-width: 140px; }
        .btn.clear-btn:hover { background: #da3633; }

        .password-wall { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; text-align: center; gap: 20px; }
        .password-wall h2 { color: #f85149; font-size: 22px; }
        .password-wall p { color: #8b949e; font-size: 14px; }
        .password-wall input { background: #161b22; border: 1px solid #30363d; color: #fff; padding: 12px 20px; border-radius: 10px; font-size: 18px; text-align: center; letter-spacing: 5px; outline: none; width: 220px; }
        .password-wall input:focus { border-color: #58a6ff; }

        .code-view-container { background: #161b22; border-radius: 12px; border: 1px solid #30363d; max-height: 480px; overflow-y: auto; margin-bottom: 140px; text-align: left; direction: ltr; }
        pre[class*="language-"] { margin: 0 !important; background: #161b22 !important; padding: 20px !important; font-size: 14px !important; }

        .fixed-copy-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(13, 17, 23, 0.95); backdrop-filter: blur(12px); border-top: 1px solid #30363d; padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 10px; box-shadow: 0 -6px 25px rgba(0,0,0,0.6); z-index: 1000; }
        
        .fixed-copy-btn { background: #1f6feb; color: white; border: none; padding: 12px 30px; font-size: 15px; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; max-width: 450px; transition: background 0.2s; box-shadow: 0 4px 12px rgba(31,111,235,0.4); display: flex; align-items: center; justify-content: center; gap: 8px; }
        .fixed-copy-btn:hover { background: #1f6feb; }
        
        .fixed-link-btn { background: #8957e5; box-shadow: 0 4px 12px rgba(137,87,229,0.4); }
        .fixed-link-btn:hover { background: #8957e5; }

        .fixed-copy-btn:disabled, .fixed-copy-btn.disabled,
        .fixed-link-btn:disabled, .fixed-link-btn.disabled { background: #30363d !important; color: #8b949e !important; cursor: not-allowed !important; transform: none !important; box-shadow: none !important; opacity: 0.5; pointer-events: none; }

        .toast { position: fixed; top: 25px; left: 50%; transform: translateX(-50%) translateY(-20px); background: #238636; color: white; padding: 12px 25px; border-radius: 10px; font-weight: bold; opacity: 0; transition: all 0.35s ease; z-index: 1100; box-shadow: 0 6px 20px rgba(0,0,0,0.5); pointer-events: none; }
        .toast.error { background: #da3633 !important; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div id="toast" class="toast">تم بنجاح!</div>

    <!-- 1. واجهة إنشاء الرابط -->
    <div class="card active" id="mainbox">
        <header>
            <div class="header-title-group">
                <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" class="logo-img" alt="Anas Gaming">
                <h1>أنس جيمينج</h1>
            </div>
            <a href="#" class="top-btn" onclick="switchView('viewbox')">عرض النص الكامل</a>
        </header>

        <div class="textarea-wrapper">
            <textarea id="userInput" placeholder="اكتب أو الصق النص هنا (يدعم أحجام ضخمة بمختلف اللغات)..." oninput="updatestats()"></textarea>
            <div class="stats-bar">
                <span id="charCount">عدد الحروف: 0</span>
                <span id="lineCount">عدد الأسطر: 0</span>
            </div>
        </div>

        <div class="advanced-settings">
            <div class="setting-item">
                <label for="passInput">حماية بكلمة مرور (من 4 إلى 6 أرقام إنجليزية)</label>
                <input type="password" id="passInput" maxlength="6" placeholder="مثال: 1234" oninput="validatePasswordInput()">
                <span id="passwordErrorMsg" class="password-error-msg">كلمة المرور يجب أن تكون بين 4 و 6 أرقام إنجليزية فقط!</span>
            </div>
            <div class="checkbox-group">
                <label>
                    <input type="checkbox" id="burnCheck"> تفعيل خيار حرق الصفحة (تدمر بعد أول قراءة)
                </label>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn clear-btn" onclick="clearText()">مسح النموذج</button>
            <button class="btn" id="generateBtn" onclick="generatelink()">إنشاء الرابط</button>
        </div>
    </div>

    <!-- 2. واجهة طلب كلمة المرور للمشاهد -->
    <div class="card" id="passwordbox">
        <header>
            <div class="header-title-group">
                <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" class="logo-img" alt="Anas Gaming">
                <h1>حماية المحتوى</h1>
            </div>
        </header>
        <div class="password-wall">
            <h2>هذا النص محمي برمز سرّي</h2>
            <p>الرجاء إدخال الرمز السرّي المكون من أرقام إنجليزية لعرض المحتوى</p>
            <input type="password" id="unlockInput" maxlength="6" placeholder="••••">
            <button class="top-btn" onclick="verifyPassword()" style="padding: 12px 30px; font-size: 16px;">فتح المحتوى</button>
        </div>
    </div>

    <!-- 3. واجهة عرض النص للمشاهد -->
    <div class="card" id="viewbox">
        <header>
            <div class="header-title-group">
                <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" class="logo-img" alt="Anas Gaming">
                <h1>عرض النص - موقع أنس جيمينج</h1>
            </div>
            <a href="#" class="top-btn" onclick="switchView('mainbox')">إنشاء نص جديد</a>
        </header>

        <div class="code-view-container">
            <pre><code id="codeDisplay" class="language-none">جار تحميل المحتوى...</code></pre>
        </div>

        <div class="fixed-copy-bar">
            <!-- زر نسخ النص (تمت إزالة كلمة فقط بناءً على طلبك) -->
            <button id="fixedCopyBtn" class="fixed-copy-btn" onclick="copyMainText()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                نسخ النص
            </button>
            <!-- زر نسخ الرابط -->
            <button id="fixedLinkBtn" class="fixed-copy-btn fixed-link-btn" onclick="copyPageLink()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
                نسخ الرابط
            </button>
        </div>
    </div>

    <!-- استدعاء هرم اللغات لـ Prism.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-lua.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>

    <script>
        let globalDecodedText = "";
        let securePass = "";

        function updatestats() {
            const text = document.getElementById('userInput').value;
            document.getElementById('charCount').textContent = "عدد الحروف: " + text.length;
            document.getElementById('lineCount').textContent = "عدد الأسطر: " + text.split('\n').length;
        }

        function clearText() {
            document.getElementById('userInput').value = "";
            document.getElementById('passInput').value = "";
            document.getElementById('burnCheck').checked = false;
            validatePasswordInput();
            updatestats();
            showToast("تم مسح النموذج بنجاح!", false);
        }

        function showToast(text, isError = false) {
            const t = document.getElementById('toast');
            t.textContent = text;
            t.className = "toast " + (isError ? "error" : "") + " show";
            setTimeout(() => { t.classList.remove('show'); }, 3000);
        }

        function switchView(viewid) {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            document.getElementById(viewid).classList.add('active');
        }

        function validatePasswordInput() {
            const passInput = document.getElementById('passInput');
            const errorMsg = document.getElementById('passwordErrorMsg');
            const generateBtn = document.getElementById('generateBtn');
            const val = passInput.value;

            const englishDigitsOnly = /^[0-9]*$/.test(val);

            if (val.length > 0 && (!englishDigitsOnly || val.length < 4 || val.length > 6)) {
                passInput.classList.add('error-border');
                errorMsg.style.display = 'block';
                generateBtn.disabled = true;
                generateBtn.classList.add('disabled');
            } else {
                passInput.classList.remove('error-border');
                errorMsg.style.display = 'none';
                generateBtn.disabled = false;
                generateBtn.classList.remove('disabled');
            }
        }

        function safeEncode(str) {
            try {
                return encodeURIComponent(btoa(unescape(encodeURIComponent(str))));
            } catch (err) {
                return "";
            }
        }

        function safeDecode(encodedStr) {
            try {
                return decodeURIComponent(escape(atob(decodeURIComponent(encodedStr))));
            } catch (err) {
                return null;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const encodedData = urlParams.get('data');
            
            if (encodedData) {
                const decodedJson = safeDecode(encodedData);
                if (decodedJson) {
                    try {
                        const payload = JSON.parse(decodedJson);
                        globalDecodedText = payload.t;
                        securePass = payload.p || "";
                        const burn = payload.b;

                        if (burn) {
                            const burnKey = "burned_" + encodedData.substring(0, 15);
                            if (localStorage.getItem(burnKey)) {
                                switchView('viewbox');
                                document.getElementById('codeDisplay').textContent = "⚠️ عذراً، تم حرق هذا الرابط وتدميره نهائياً بعد أول قراءة ولن يعمل مرة أخرى!";
                                
                                document.getElementById('fixedCopyBtn').disabled = true;
                                document.getElementById('fixedCopyBtn').classList.add('disabled');
                                document.getElementById('fixedLinkBtn').disabled = true;
                                document.getElementById('fixedLinkBtn').classList.add('disabled');
                                throw new Error("Burned");
                            }
                            localStorage.setItem(burnKey, "true");
                        }

                        if (securePass) {
                            switchView('passwordbox');
                        } else {
                            showContent(globalDecodedText);
                        }
                    } catch (e) {
                        if (e.message !== "Burned") {
                            switchView('mainbox');
                            showToast("عذراً، الرابط تالف أو غير صالح!", true);
                        }
                    }
                } else {
                    switchView('mainbox');
                    showToast("عذراً، فشل في قراءة بيانات الرابط!", true);
                }
            }
        });

        function verifyPassword() {
            const enteredPass = document.getElementById('unlockInput').value;
            if (enteredPass === securePass) {
                showContent(globalDecodedText);
            } else {
                showToast("كلمة المرور غير صحيحة!", true);
            }
        }

        function showContent(text) {
            switchView('viewbox');
            const codeElement = document.getElementById('codeDisplay');
            codeElement.textContent = text;
            detectAndHighlight(text, codeElement);
        }

        function detectAndHighlight(text, element) {
            let detectedLang = 'none';
            const lower = text.toLowerCase();
            if (lower.includes('def ') || lower.includes('import ') || lower.includes('print(')) detectedLang = 'python';
            else if (lower.includes('function') || lower.includes('const ') || lower.includes('console.log')) detectedLang = 'javascript';
            else if (lower.includes('local ') || lower.includes('end') || lower.includes('game.players')) detectedLang = 'lua';
            else if (text.trim().startsWith('<') && text.trim().endsWith('>')) detectedLang = 'markup';
            else if (text.trim().startsWith('{') || text.trim().startsWith('[')) detectedLang = 'json';
            
            element.className = "language-" + detectedLang;
            Prism.highlightElement(element);
        }

        function generatelink() {
            const text = document.getElementById('userInput').value;
            const pass = document.getElementById('passInput').value.trim();
            const burn = document.getElementById('burnCheck').checked;

            if (!text.trim()) {
                showToast("الرجاء كتابة أو لصق نص أولاً!", true);
                return;
            }

            const payload = { t: text, b: burn };
            if (pass) { payload.p = pass; }

            const encoded = safeEncode(JSON.stringify(payload));
            if (!encoded) {
                showToast("النص طويل جداً أو حدث خطأ أثناء التشفير!", true);
                return;
            }

            let fullLink = window.location.origin + window.location.pathname + '?data=' + encoded;
            if (pass) { fullLink += '&p=1'; }

            window.location.href = fullLink;
        }

        function copyMainText() {
            navigator.clipboard.writeText(globalDecodedText).then(() => {
                showToast("تم نسخ النص بنجاح!");
            }).catch(err => {
                showToast("فشل في نسخ النص!", true);
            });
        }

        function copyPageLink() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                showToast("تم نسخ رابط الصفحة بنجاح!");
            }).catch(err => {
                showToast("فشل في نسخ الرابط!", true);
            });
        }
    </script>
</body>
</html>
